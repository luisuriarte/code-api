dentar:
    meta_title: "DENTAR | Catálogo Argentino de Procedimentos Odontológicos"
    meta_description: "DENTAR é uma iniciativa da Origen Salud para normalizar procedimentos e diagnósticos odontológicos, facilitar a interoperabilidade e conectar a odontologia argentina a padrões internacionais."
    hero_eyebrow: "Catálogo odontológico · Origen Salud"
    hero_title: "DENTAR"
    hero_subtitle: "O Catálogo Argentino de Procedimentos Odontológicos"
    hero_lead: "Uma iniciativa da Origen Salud para estruturar, normalizar e conectar procedimentos e diagnósticos odontológicos por meio de um catálogo clínico interoperável, em espanhol e com projeção latino-americana."
    hero_primary: "Consultar procedimentos"
    hero_secondary: "Consultar diagnósticos"
    hero_docs: "Conhecer a documentação"
    hero_note: "DENTAR-PR · DENTAR-DX · Interoperabilidade em saúde"
    hero_card_title: "Família DENTAR"
    hero_card_label: "Catálogos ativos"
    hero_card_pr: "DENTAR-PR · Procedimentos"
    hero_card_dx: "DENTAR-DX · Diagnósticos"
    hero_card_foot: "Catálogos independentes com prefixos e ciclos de versão próprios"
    problem_eyebrow: "Apresentação do projeto"
    problem_title: "Uma linguagem comum para a odontologia"
    problem_lead: "DENTAR pretende oferecer uma referência estruturada e mantida, não apenas uma lista de códigos."
    problem_1_title: "Diversidade de nomenclaturas"
    problem_1_text: "Convivem denominações e sistemas de codificação diferentes para descrever a mesma prestação odontológica."
    problem_2_title: "Descrições divergentes"
    problem_2_text: "A mesma prática pode aparecer com textos diferentes conforme o sistema, o financiador ou a instituição."
