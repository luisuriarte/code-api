cdtnn:
    title: "Exposição real de CDT e nomencladores"
    intro: "CDT e NN 2025 mantêm suas tabelas nativas. Não são inventadas traduções, dialetos nem mapeamentos para tabelas os_*."
    cdt_title: "ADA CDT 2025 (tabelas nativas)"
    cdt_text: "CDT é exposto pela busca odontológica genérica e pelo endpoint de detalhe. nombre_es mapeia para es e nombre_en para en; dialect_determined=false para es."
    cdt_search: "Busca CDT via /v1/search/odontologia"
    cdt_detail: "Detalhe via /v1/odontologia/{id}"
    cdt_dialect: "Um texto CDT em es nunca é apresentado como es-AR sem evidência regional."
    no_cdt_endpoint: "Não existe o endpoint /v1/cdt."
    nn_title: "Nomenclador Nacional 2025 (NN 2025)"
    nn_text: "Permanece em nomenclador_2025. Não tem endpoint próprio nem mapeamento para os_*; sua exposição futura continua pendente."
    nomenclador_title: "Nomencladores argentinos"
    nomenclador_text: "GET /v1/nomenclador consulta nomencladores_argentina, o único com entity_type='nomenclador'. Não serve CDT."

about:
    eyebrow: "Sobre a Origen Salud"
    title: "Terminologia clínica como infraestrutura"
    lead: "Construímos a camada terminológica que permite a sistemas de saúde, empresas de software e instituições falar a mesma língua clínica."
    mission_title: "Nossa missão"
    mission_text: "A Origen Salud reúne catálogos oficiais de saúde e os expõe de forma consistente, segura e multilíngue, para que cada organização possa integrá-los sem reconstruí-los."
    scope_title: "Escopo"
    scope_text: "Trabalhamos com SNOMED CT, CIE-10, LOINC, DENTAR, PMO, ANMAT e nomencladores argentinos, respeitando as estruturas originais de cada fonte."
    interoperability_title: "Interoperabilidade"
    interoperability_text: "Nosso motor comum os_* convive com tabelas especializadas. Não forçamos modelos uniformes quando a fonte exige um tratamento próprio."
    catalogs_title: "Catálogos e terminologias"
    catalogs_text: "Cada catálogo mantém sua identidade, versão e regras de publicação. O explorador do portal mostra apenas os campos habilitados para publicação."
    region_title: "Projeção regional"
    region_text: "Nascemos na Argentina e desenhamos nossa arquitetura para a América Latina, com espanhol argentino, inglês e português brasileiro como idiomas do portal."
    principles_title: "Princípios"
    principle_1_title: "Precisão terminológica"
    principle_1_text: "Não geramos traduções automáticas de termos clínicos. Publicamos apenas conteúdo aprovado pelo modelo editorial vigente."
    principle_2_title: "Rastreabilidade"
    principle_2_text: "Cada texto publicado conserva seu idioma efetivo, procedência e estado editorial quando é adequado exibi-los."
    principle_3_title: "Integração simples"
    principle_3_text: "API pública para sistemas externos e portal próprio para explorar e contratar, com responsabilidades separadas."
    cta_title: "Quer conhecer o catálogo disponível?"
    cta_text: "Explore os códigos ou escreva para nós para avaliar uma integração."

