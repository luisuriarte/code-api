        implemented: Disponível
        method_get: GET
        method_options: OPTIONS
        see_openapi: 'A fonte canônica de rotas e esquemas é o arquivo OpenAPI 3.1 do repositório.'
        json_only: 'Todas as respostas usam application/json; charset=utf-8. Não há negociação por Accept nem formatos alternativos.'
    overview:
        title: '1. Visão geral'
        lead: 'A API pública da Origen Salud é um serviço REST somente leitura. Todas as operações são realizadas por HTTPS no host api.origen.ar.'
        env_col: Ambiente
        url_col: URL
        access_col: Acesso
        rest_desc: 'Superfície /v1/* com API Key. Apenas os métodos GET e OPTIONS são suportados.'
        health_desc: 'Verificação pública de disponibilidade; executa SELECT 1 no banco de dados.'
        health_title: 'Health check'
        health_note: 'Ao contrário do restante da API, /health retorna um objeto plano: não inclui data, meta nem request_id no corpo. O request_id é enviado no cabeçalho X-Request-Id.'
        response_title: 'Formato de resposta'
        response_text: 'As rotas /v1/* retornam um envelope com data, meta e request_id. Os erros usam error e request_id. Não há versionamento por cabeçalho, query ou corpo: a versão é o prefixo /v1 da rota.'
    auth:
        title: '2. Autenticação'
        lead: 'Toda rota que começa com /v1/ exige uma API Key ativa. Rotas inexistentes dentro de /v1/ também retornam 401 se a credencial não for enviada.'
        header_title: 'Cabeçalhos aceitos'
        header_text: 'Envie a chave em um destes dois cabeçalhos. Se ambos estiverem presentes, X-API-Key tem prioridade sobre Authorization.'
        bearer: 'Authorization: Bearer TU_API_KEY'
        xapikey: 'X-API-Key: TU_API_KEY'
        warning_title: 'Não exponha a credencial'
        warning_text: 'A API Key deve permanecer em um backend seguro. Não a inclua em HTML público, aplicações SPA, bundles JavaScript, repositórios nem aplicativos móveis sem uma camada intermediária.'
        management_title: 'Gerenciamento de credenciais'
        management_text: 'Atualmente não há registro self-service, emissão, rotação, expiração nem revogação por API. A tabela api_clients dispõe apenas de is_active. O registro e a rotação continuam pendentes.'
        format_title: 'Formato e validação'
        format_text: 'A chave aceita até 128 caracteres ASCII imprimíveis. Uma credencial ausente, vazia, mal formatada, inativa ou inexistente retorna 401 com error.code = unauthorized.'
        header: Cabeçalho
    conventions:
        title: '3. Convenções da API'
        lead: 'Estas regras se aplicam a todas as rotas /v1/* salvo indicação explícita.'
        success_title: 'Envelope de sucesso'
        error_title: 'Envelope de erro'
        request_id_title: 'Identificador da solicitação'
        request_id_text: 'O servidor gera um hexadecimal de 32 caracteres quando X-Request-Id não é enviado. Esse mesmo valor é retornado no cabeçalho X-Request-Id e em request_id no corpo. Em /health, aparece apenas no cabeçalho.'
        lang_title: 'Idioma do conteúdo'
        lang_text: 'O parâmetro lang tem prioridade; em seguida é usado Accept-Language e, por fim, API_DEFAULT_LANG (es). Os aliases es e pt são resolvidos para es-AR e pt-BR. Textos sem revisão editorial aprovada são publicados como null com untranslated=true.'
        pagination_title: 'Paginação e limites'
        pagination_text: 'Em /v1/search, limit tem por padrão 20 e o máximo efetivo é 50, salvo configuração explícita de API_PAGE_LIMIT_MAX (limite 100). offset varia de 0 a 5000. Outros endpoints têm limites próprios: /v1/catalogs/*/items usa 1–100 fixo, /v1/mappings retorna até 50 sem paginação e /v1/odontologia/diagnosticos não é paginado.'
        methods_title: 'Métodos e CORS'
        methods_text: 'Não existem operações de escrita. Os métodos suportados são GET e um OPTIONS global que responde 204 antes da autenticação. O CORS emite cabeçalhos apenas se API_CORS_ORIGINS estiver configurado; por padrão, https://med.origen.ar é permitido.'
        headers_title: 'Cabeçalhos de resposta'
        headers_text: 'Além de Content-Type e X-Request-Id, a API envia Cache-Control: no-store, X-Content-Type-Options: nosniff, Referrer-Policy: no-referrer e, quando aplicável, Content-Language, Vary e WWW-Authenticate.'
        codes_col: HTTP
        code_col: error.code
        meaning_col: Significado
        err_400: 'Parâmetro ausente ou inválido; details pode explicar o motivo.'
        err_401: 'API Key ausente, inválida ou inativa. Inclui WWW-Authenticate: Bearer.'
        err_404: 'Rota ou recurso inexistente.'
        err_405: 'Método não permitido. Inclui Allow: GET, OPTIONS.'
        err_500: 'Erro interno. Mensagens sensíveis nunca são expostas ao cliente.'
        err_503: 'Banco de dados indisponível ou API não configurada.'
        no_403: 'A API não emite 403 nem 429. Não há cotas nem suspensão por comportamento implementadas no serviço.'
    quickstart:
        title: '4. Primeiras chamadas'
        lead: 'O exemplo a seguir consulta os itens do catálogo dentar-pr. Substitua TU_API_KEY por uma credencial válida emitida pela Origen Salud.'
        endpoint_label: 'Endpoint do exemplo'
        code_title: 'Exemplo por linguagem'
        response_title: 'Resposta 200'
        response_note: 'A forma de data depende do catálogo consultado. O envelope e o request_id são comuns a todas as rotas /v1/*.'
        security_note: 'Execute estas chamadas a partir do seu servidor. Nunca cole uma API Key real em uma página pública nem em um repositório.'
        step1: '1. Obtenha uma API Key ativa da Origen Salud.'
        step2: '2. Envie X-API-Key ou Authorization: Bearer em toda solicitação /v1/*.'
        step3: '3. Leia data para o resultado e request_id para correlacionar logs.'
    search:
        title: '5. Busca unificada'
        lead: 'A busca consulta vários vocabulários em uma única chamada e retorna resultados com domain, source, id, code, term, language, kind, score e metadata.'
        endpoints_title: 'Rotas disponíveis'
        endpoints_text: 'GET /v1/search busca nos domínios indicados. GET /v1/search/{domain} força um domínio. GET /v1/concepts/search força SNOMED CT e retorna uma projeção de descrições.'
        domains_title: Domínios
        domains_text: 'Domínios válidos: snomed, cie10, anmat, laboratorio, vacunas, odontologia, prestaciones, programas, imagenes, nomenclador, vademecum e loinc. domains=all ou domains=* inclui todos. Sem domains, são usados snomed, cie10 e anmat.'
        params_title: Parâmetros
        param_q: 'Termo de 2 a 80 caracteres. Obrigatório.'
        param_domains: 'Lista separada por vírgulas ou parâmetros repetidos. Alias: domain.'
        param_lang: 'Idioma solicitado para as descrições.'
        param_limit: 'Resultados por página. Padrão 20; máximo efetivo 50.'
        param_offset: 'Deslocamento de 0 a 5000.'
        param_cie10: 'Filtra CIE-10 pelos valores diagnostico ou procedimiento.'
        param_refset: 'Um a 10 códigos de refset. Alias: refsets. Aplica-se apenas quando snomed está incluído.'
        meta_title: 'Metadados da busca'
        meta_text: 'meta inclui query, language, domains, cie10_type, refsets, limit, offset, returned, has_more, next_offset, page_counts e took_ms.'
        concepts_title: 'Projeção de conceitos'
        concepts_text: 'GET /v1/concepts/search retorna description_id, concept_id, term, language, term_type, type_id e score em vez do resultado genérico.'
        example_title: 'Exemplo com cURL'
    catalogs:
        title: '6. Motor de catálogos'
        lead: 'O motor expõe catálogos versionados, releases publicadas, itens ativos, identifiers oficiais, mapeamentos e tarifas vigentes.'
        list_title: 'Listar catálogos'
        list_text: 'GET /v1/catalogs retorna code, name, short_name, family, role, organization, country, domain_type, items_count e website. Os catálogos family aparecem primeiro.'
        releases_title: Releases
        releases_text: 'GET /v1/catalogs/{catalog_code}/releases retorna release_id, version, valid_from, valid_to, normative e status.'
        items_title: Itens
        items_text: 'GET /v1/catalogs/{catalog_code}/items aceita q ou query, category, limit e offset. Retorna permanent_code, official_code, term, category e pricing.'
        detail_title: 'Detalhe de um item'
        detail_text: 'GET /v1/catalogs/{catalog_code}/items/{item} acrescenta definições, critérios clínicos, sinônimos, mappings, identifiers e metadados editoriais por campo.'
        codes_title: 'Catálogos publicados'
        codes_text: 'Esses códigos estão disponíveis por meio do motor de catálogos quando a release correspondente está publicada.'
        code_dentar_pr: 'Procedimentos odontológicos próprios com códigos DNT-PR-NNNNNN.'
        code_dentar_dx: 'Diagnósticos odontológicos próprios com códigos DNT-DX-NNNNNN.'
        code_nomenclador: 'Nomenclador Odontológico Nacional como catálogo de origem e identificador secundário de DENTAR-PR.'
        code_nbu: 'Nomenclador Bioquímico Único com Unidades Bioquímicas.'
        code_nn_pmo: 'Nomenclador Nacional de práticas médicas e cirúrgicas.'
        editorial_title: 'Controle editorial de idioma'
        editorial_text: 'Campos com revisão aprovada vigente são servidos no idioma efetivo. Se não houver revisão, o valor é null e untranslated=true. Um dialeto nunca é inferido a partir de uma tradução genérica.'
        pricing_title: 'Tarifas vigentes'
        pricing_text: 'pricing expõe unit_type, unit_name, units, fixed_price e expenses de os_fee_item para a data atual. Não inclui valores UVR nem conversões para pesos.'
    mappings:
        title: '7. Mapeamentos e farmácia'
        lead: 'Relações entre catálogos e identificadores de produtos farmacêuticos.'
        search_title: 'GET /v1/mappings'
        search_text: 'Aceita system, code e catalog. Retorna catalog, catalog_code, term, target_system, target_uri, target_code, target_display, equivalence, role, rationale e field_languages. Está limitado a 50 resultados sem paginação.'
        units_title: 'GET /v1/pricing-units'
        units_text: 'Lista code, name, organization e description das unidades tarifárias configuradas, por exemplo UB.'
        pharma_title: 'GET /v1/medicines/identifiers/{system}/{code}'
        pharma_text: 'Busca um medicamento por TROQUEL, ALFABETA, KAIROS ou GTIN. system é normalizado para maiúsculas. Retorna marca, laboratório, ingrediente, apresentação, forma farmacêutica, tipo de venda, ação farmacológica e identifiers.'
        param_system: 'Sistema de identificador: troquel, alfabeta, kairos ou gtin.'
        param_code: 'Código dentro do sistema indicado.'
        param_catalog: 'Código de catálogo; filtra os mapeamentos retornados.'
        example_title: 'Exemplo com cURL'
    clinical:
        title: '8. Terminologias clínicas'
        lead: 'Endpoints específicos para as fontes terminológicas mais utilizadas.'
        snomed_title: 'SNOMED CT'
        snomed_text: 'GET /v1/snomed/{sctid} e GET /v1/concepts/{id} retornam concept_id, descrições agrupadas por idioma, pais, filhos, códigos CIE-10 e um bloco odontológico quando existem dados vinculados.'
        cie10_title: CIE-10
        cie10_text: 'GET /v1/cie10/{codigo} valida o formato do código e retorna type, descriptions por idioma e até 50 snomed_concepts relacionados.'
        loinc_title: LOINC
        loinc_text: 'GET /v1/loinc aceita q, class, status, system, limit e offset. GET /v1/loinc/{code} acrescenta definição, fórmula, MapTo e nomencladores argentinos associados.'
        anmat_title: ANMAT
        anmat_text: 'GET /v1/anmat/{id} retorna certificate, commercial_name, generic_name, pharmaceutical_form, presentation, laboratory e snomed_concept quando o vínculo existe.'
        nomenclador_title: 'Nomencladores argentinos'
        nomenclador_text: 'GET /v1/nomenclador consulta nomencladores_argentina com q, type ou tipo e limit. type aceita NN_PMO, NBU, NHPGD, ANDIS, KINESIOLOGIA e SALUD_MENTAL.'
        vademecum_title: Vademecum
        vademecum_text: 'GET /v1/vademecum aceita q, troquel, alfabeta, kairos, gtin e limit. Retorna dados comerciais e o concept_id SNOMED vinculado.'
        pmo_title: PMO
        pmo_text: 'GET /v1/pmo/practicas, /v1/pmo/practicas/{code}, /v1/pmo/medicamentos e /v1/pmo/normativa expõem práticas, medicamentos e texto normativo com seus próprios filtros.'
        local_title: 'Catálogos locais'
        local_text: 'GET /v1/{laboratorio|vacunas|odontologia|prestaciones|programas|imagenes}/{id} retorna o detalhe genérico destes catálogos locais. Relações de UI como focus, tab ou compare não fazem parte deste contrato REST.'
    dental:
        title: '9. Odontologia e DENTAR'
        lead: 'A DENTAR publica procedimentos e diagnósticos próprios, sem duplicar equivalências clínicas presumidas entre fontes.'
        codes_title: 'Códigos visíveis'
        codes_text: 'Os códigos permanentes têm o formato DNT-PR-NNNNNN para procedimentos e DNT-DX-NNNNNN para diagnósticos. Os códigos oficiais de cada fonte são preservados como identificadores secundários rotulados.'
        pr_title: 'Procedimentos DENTAR-PR'
        pr_text: 'GET /v1/catalogs/dentar-pr/items e /items/{code} expõem serviços odontológicos com seu código permanente, código oficial, categoria, tarifa e mapeamentos.'
        dx_title: 'Diagnósticos DENTAR-DX'
        dx_text: 'GET /v1/odontologia/diagnosticos busca por q, snomed ou cie10. GET /v1/odontologia/diagnosticos/{identifier} aceita código DENTAR, SCTID, CIE-10 ou ID numérico.'
        just_title: 'Justificativa de serviços'
        just_text: 'GET /v1/odontologia/{identifier}/diagnosticos retorna o serviço e os diagnósticos que o justificam, com relationship_type e clinical_rationale literalmente da fonte.'
        snomed_title: 'Resolução por SNOMED-CT'
        snomed_text: 'GET /v1/odontologia/snomed/{sctid} informa has_procedures, has_diagnoses e as coleções procedures e diagnoses vinculadas ao conceito.'
        nomenclador_title: 'Nomenclador Odontológico Nacional'
        nomenclador_text: 'Está integrado como catálogo de origem consultável (nomenclador-odontologico-ar) e como identificador secundário pesquisável em DENTAR-PR. Não são publicadas traduções nem equivalências clínicas inferidas.'
        cdt_title: 'CDT e NN 2025'
        cdt_text: 'O CDT permanece em suas tabelas nativas e é exposto por busca e detalhe de odontologia. Um texto CDT em es nunca é apresentado como es-AR sem evidência regional.'
        cdt_no_endpoint: 'Não existe /v1/cdt.'
        nn_title: 'NN 2025'
        nn_text: 'Permanece em nomenclador_2025. Não tem endpoint próprio nem mapeamento para as tabelas os_*; sua exposição futura está pendente.'
        relations_title: 'Relações literais'
        relations_text: 'As relações entre procedimentos, diagnósticos e códigos externos são mostradas exatamente como constam na fonte. Dois códigos não devem ser interpretados como clinicamente equivalentes, a menos que a fonte declare isso explicitamente.'
        example_title: 'Exemplo com cURL'
    pending:
        title: '10. Funcionalidades pendentes'
        lead: 'Tudo o que está listado neste artigo está fora do contrato atual. Não deve ser documentado nem consumido como disponível.'
        fhir_title: 'HL7 FHIR R4'
        fhir_text: 'Não existe nenhuma rota /fhir em api/index.php. README-FHIR.md descreve um contrato proposto. A proteção de autenticação atual cobre apenas /v1/, portanto qualquer implementação futura deve revisar esse escopo antes da publicação.'
        uvr_title: UVR
        uvr_text: 'As tabelas UVR estão propostas e vazias. Nenhum endpoint consulta valores UVR, componentes, conversões ou índices geográficos.'
        oauth_title: 'OAuth, scopes e rate limiting'
        oauth_text: 'Não há OAuth 2.0, JWT, scopes, cotas nem 429. O campo rate_limit_per_second é consultado, mas não aplicado. Também não existe 403 por suspensão ou cota.'
        writes_title: 'Operações de escrita'
        writes_text: 'Não há POST, PUT, PATCH nem DELETE. A API é somente leitura e não gerencia catálogos, credenciais nem traduções.'
        console_title: 'Console de desenvolvedores'
        console_text: 'Não há registro self-service, painel de API Keys, rotação automática nem expiração/revogação por endpoint. As chaves são armazenadas em texto simples atualmente, e seu hash é uma tarefa pendente.'
        catalogs_title: 'Catálogos reservados'
        catalogs_text: 'dentar-an, dentar-cl, dentar-in, dentar-pd e dentar-eq estão reservados sem dados públicos. Também não são expostas relações os_catalog_relation pela API, nem conteúdo PHI como imagens PACS.'
        alignment_title: 'Alinhamento da especificação'
        alignment_text: 'A OpenAPI vigente tem desvios conhecidos em relação ao código: request_id declarado como UUID, /health com request_id no body, q.maxLength=200, lang padrão es-AR e parâmetros ausentes em vários endpoints. Corrigir a spec é uma tarefa pendente.'
    openapi:
        title: '11. OpenAPI e geração de clientes'
        lead: 'A especificação existente é a referência para client generation, mas deve ser confrontada com o código até que o alinhamento seja concluído.'
        spec_title: 'Especificação vigente'
        spec_text: 'docs/api/openapi-3.1.yaml declara openapi 3.1.0, 30 paths, 30 operações GET e referências válidas. Não inclui /fhir/* porque não está implementado.'
        spec_link: 'Arquivo de especificação'
        divergences_title: 'Conciliação aplicada'
        divergences_text: 'Estes desvios foram corrigidos na Fase 2. Use esta tabela como lista de verificação ao gerar clientes ou testes de contrato.'
        div_q: 'q: a spec declara 2–80 caracteres, como o código em /v1/search.'
        div_lang: 'lang: a spec declara es por padrão, como API_DEFAULT_LANG.'
        div_limit: 'limit: a spec declara máximo 100 e esclarece que o efetivo é 50.'
        div_request_id: 'request_id: a spec não declara mais UUID; documenta 32 hexadecimais ou X-Request-Id de 8–64 caracteres.'
        div_health: '/health: a spec não declara mais request_id no body; a resposta é plana.'
        div_domains: 'Domain: a spec usa id e label/description por idioma, como a resposta real.'
        div_params: 'A spec documenta os parâmetros implementados: cie10_type, refset, class, status, system, offset, alfabeta, kairos e gtin, entre outros.'
        div_methods: 'A spec documenta OPTIONS/204 sem Allow e 405 com Allow: GET, OPTIONS.'
        generate_title: 'Recomendação de integração'
        generate_text: 'Gere o cliente a partir da spec, adicione testes de contrato para os desvios listados e mantenha a API Key fora do código gerado e de qualquer artefato público.'
    support:
        title: '12. Segurança e suporte'
        lead: 'Boas práticas operacionais e canais de contato.'
        security_title: Segurança
        security_text: 'Use HTTPS, armazene a credencial em um gerenciador de segredos, gire-a manualmente quando apropriado e não a registre em logs. A API não expõe mensagens internas em erros 500.'
        logging_title: Rastreabilidade
        logging_text: 'Os logs do servidor registram request_id, método, rota e classe de exceção, mas não termos de busca nem dados clínicos. Salve o request_id do cabeçalho para correlacionar incidentes.'
        contact_title: Contato
        contact_text: 'Para solicitar uma API Key, relatar um desvio de contrato ou consultar a disponibilidade de dados, escreva para contacto@origen.ar.'
        legal_title: 'Avisos legais'
        legal_text: 'SNOMED CT® é uma marca registrada da SNOMED International. A Origen Salud não é afiliada nem endossada pela SNOMED International. As fontes oficiais são usadas como referência e mantêm seus termos de uso.'
        no_credentials: ' Este site nunca solicitará uma API Key real.'
    footer:
        rights: '© 2026 Origen Salud. Todos os direitos reservados.'
        disclaimer: 'Documentação baseada no contrato real da API pública v1.'
