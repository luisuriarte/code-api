about:
    eyebrow: "About Origen Salud"
    title: "Clinical terminology as infrastructure"
    lead: "We build the terminology layer that lets health systems, software companies and institutions speak the same clinical language."
    mission_title: "Our mission"
    mission_text: "Origen Salud brings together official health catalogs and exposes them consistently, securely and multilingually, so every organization can integrate them without rebuilding them."
    scope_title: "Scope"
    scope_text: "We work with SNOMED CT, ICD-10, LOINC, DENTAR, PMO, ANMAT and Argentine nomenclators, respecting the original structures of each source."
    interoperability_title: "Interoperability"
    interoperability_text: "Our common os_* engine coexists with specialized tables. We do not force uniform models where a source requires its own treatment."
    catalogs_title: "Catalogs and terminologies"
    catalogs_text: "Each catalog keeps its identity, version and publication rules. The portal explorer only shows fields enabled for publication."
    region_title: "Regional outlook"
    region_text: "We are based in Argentina and design our architecture for Latin America, with Argentine Spanish, English and Brazilian Portuguese as portal languages."
    principles_title: "Principles"
    principle_1_title: "Terminological accuracy"
    principle_1_text: "We do not generate automatic translations of clinical terms. We only publish content approved by the current editorial model."
    principle_2_title: "Traceability"
    principle_2_text: "Every published text keeps its effective language, provenance and editorial state when it is appropriate to show them."
    principle_3_title: "Simple integration"
