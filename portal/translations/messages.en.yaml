    common:
        rest_url: 'https://api.origen.ar'
        health_url: 'https://api.origen.ar/health'
        production: Production
        public: Public
        authenticated: 'Requires API Key'
        required: Required
        optional: Optional
        'yes': 'Yes'
        'no': 'No'
        default: Default
        max: Maximum
        illustrative: 'Illustrative example: actual values depend on the data loaded in the environment.'
        note: Note
        warning: Warning
        pending: Pending
        not_implemented: 'Not implemented'
        implemented: Available
        method_get: GET
        method_options: OPTIONS
        see_openapi: "The canonical source for routes and schemas is the repository's OpenAPI 3.1 file."
        json_only: 'All responses use application/json; charset=utf-8. There is no Accept negotiation or alternative format.'
    overview:
        title: '1. Overview'
        lead: 'The Origen Salud public API is a read-only REST service. All operations are performed over HTTPS on the api.origen.ar host.'
        env_col: Environment
        url_col: URL
        access_col: Access
        rest_desc: '/v1/* surface with API Key. Only GET and OPTIONS methods are supported.'
        health_desc: 'Public availability check; it runs SELECT 1 against the database.'
        health_title: 'Health check'
        health_note: 'Unlike the rest of the API, /health returns a flat object: it does not include data, meta, or request_id in the body. The request_id is still sent in the X-Request-Id header.'
        response_title: 'Response format'
        response_text: '/v1/* routes return an envelope with data, meta, and request_id. Errors use error and request_id. There is no versioning via header, query string, or body: the version is the /v1 prefix in the route.'
    auth:
        title: '2. Authentication'
        lead: 'Every route beginning with /v1/ requires an active API Key. Non-existent routes under /v1/ also return 401 if no credential is sent.'
        header_title: 'Accepted headers'
        header_text: 'Send the key in one of these two headers. If both are present, X-API-Key takes precedence over Authorization.'
        bearer: 'Authorization: Bearer TU_API_KEY'
        xapikey: 'X-API-Key: TU_API_KEY'
        warning_title: 'Do not expose the credential'
        warning_text: 'The API Key must remain in a secure backend. Do not include it in public HTML, SPA applications, JavaScript bundles, repositories, or mobile apps without an intermediary layer.'
        management_title: 'Credential management'
        management_text: 'The customer portal implements creating, rotating and revoking credentials for the own API, protected by permissions and disabled by default: it requires the credential DSN to be configured. `api_clients` still has no scopes or expiration; issuing a key creates no customers or invoices.'
        format_title: 'Format and validation'
        format_text: 'The key accepts up to 128 printable ASCII characters. A missing, empty, malformed, inactive, or non-existent credential returns 401 with error.code = unauthorized.'
        header: Header
    conventions:
        title: '3. API conventions'
        lead: 'These rules apply to all /v1/* routes unless explicitly stated otherwise.'
        success_title: 'Success envelope'
        error_title: 'Error envelope'
        request_id_title: 'Request identifier'
        request_id_text: 'The server generates a 32-character hexadecimal value when X-Request-Id is not sent. That same value is returned in the X-Request-Id header and in request_id in the body. In /health it appears only in the header.'
        lang_title: 'Content language'
        lang_text: 'The lang parameter takes precedence; Accept-Language is used next, and finally API_DEFAULT_LANG (es). The aliases es and pt resolve to es-AR and pt-BR. Texts without approved editorial review are published as null with untranslated=true.'
        pagination_title: 'Pagination and limits'
        pagination_text: 'In /v1/search, limit defaults to 20 and the effective maximum is 50 unless API_PAGE_LIMIT_MAX is explicitly configured (cap 100). offset ranges from 0 to 5000. Other endpoints have their own limits: /v1/catalogs/*/items uses a fixed 1–100 range, /v1/mappings returns up to 50 without pagination, and /v1/odontologia/diagnosticos is not paginated.'
        methods_title: 'Methods and CORS'
        methods_text: 'There are no write operations. The supported methods are GET and a global OPTIONS that returns 204 before authentication. CORS emits headers only if API_CORS_ORIGINS is configured; without configuration there are no headers (same-origin). The example includes https://med.origen.ar.'
        headers_title: 'Response headers'
        headers_text: 'In addition to Content-Type and X-Request-Id, the API sends Cache-Control: no-store, X-Content-Type-Options: nosniff, Referrer-Policy: no-referrer and, when applicable, Content-Language, Vary, and WWW-Authenticate.'
        codes_col: HTTP
        code_col: error.code
        meaning_col: Meaning
        err_400: 'Missing or invalid parameter; details may explain the reason.'
        err_401: 'Missing, invalid, or inactive API Key. Includes WWW-Authenticate: Bearer.'
        err_404: 'Non-existent route or resource.'
        err_405: 'Method not allowed. Includes Allow: GET, OPTIONS.'
        err_500: 'Internal error. Sensitive messages are never exposed to the client.'
        err_503: 'Database unavailable or API not configured.'
        no_403: 'The API does not emit 403 or 429. No quotas or behavior-based suspension are implemented in the service.'
    quickstart:
        title: '4. First calls'
        lead: 'The following example queries items in the dentar-pr catalog. Replace TU_API_KEY with a valid credential issued by Origen Salud.'
        endpoint_label: 'Example endpoint'
        code_title: 'Example by language'
        response_title: '200 response'
        response_note: 'The shape of data depends on the catalog queried. The envelope and request_id are common to all /v1/* routes.'
        security_note: 'Run these calls from your server. Never paste a real API Key into a public page or repository.'
        step1: '1. Obtain an active API Key from Origen Salud.'
        step2: '2. Send X-API-Key or Authorization: Bearer with every /v1/* request.'
        step3: '3. Read data for the result and request_id to correlate logs.'
    search:
        title: '5. Unified search'
        lead: 'Search queries multiple vocabularies in a single call and returns results with domain, source, id, code, term, language, kind, score, and metadata.'
        endpoints_title: 'Available routes'
        endpoints_text: 'GET /v1/search searches the specified domains. GET /v1/search/{domain} forces a single domain. GET /v1/concepts/search forces SNOMED CT and returns a projection of descriptions.'
        domains_title: Domains
        domains_text: 'Valid domains: snomed, cie10, anmat, laboratorio, vacunas, odontologia, prestaciones, programas, imagenes, nomenclador, vademecum, loinc, and oftar. domains=all or domains=* includes all of them. Without domains, snomed, cie10, and anmat are used.'
        params_title: Parameters
        param_q: 'Term of 2 to 80 characters. Required.'
        param_domains: 'Comma-separated list or repeated parameters. Alias: domain.'
        param_lang: 'Requested language for descriptions.'
        param_limit: 'Results per page. Default 20; effective maximum 50.'
        param_offset: 'Offset from 0 to 5000.'
        param_cie10: 'Filters CIE-10 by the diagnostico or procedimiento values.'
        param_refset: 'One to 10 refset codes. Alias: refsets. Only applies when snomed is included.'
        meta_title: 'Search metadata'
        meta_text: 'meta includes query, language, domains, cie10_type, refsets, limit, offset, returned, has_more, next_offset, page_counts, and took_ms.'
        concepts_title: 'Concept projection'
        concepts_text: 'GET /v1/concepts/search returns description_id, concept_id, term, language, term_type, type_id, and score instead of the generic result.'
        example_title: 'Example with cURL'
    catalogs:
        title: '6. Catalog engine'
        lead: 'The engine exposes versioned catalogs, published releases, active items, official identifiers, mappings, and current pricing.'
        list_title: 'List catalogs'
        list_text: 'GET /v1/catalogs returns code, name, short_name, family, role, organization, country, domain_type, items_count, and website. family catalogs appear first.'
        releases_title: Releases
        releases_text: 'GET /v1/catalogs/{catalog_code}/releases returns release_id, version, valid_from, valid_to, normative, and status.'
        items_title: Items
        items_text: 'GET /v1/catalogs/{catalog_code}/items accepts q or query, category, limit, and offset. It returns permanent_code, official_code, term, category, and pricing.'
        detail_title: 'Item detail'
        detail_text: 'GET /v1/catalogs/{catalog_code}/items/{item} adds definitions, clinical criteria, synonyms, mappings, identifiers, and per-field editorial metadata.'
        codes_title: 'Published catalogs'
        codes_text: 'These codes are available through the catalog engine when the corresponding release is published.'
        code_dentar_pr: 'Proprietary dental procedures with DNT-PR-NNNNNN codes.'
        code_dentar_dx: 'Proprietary dental diagnoses with DNT-DX-NNNNNN codes.'
        code_nomenclador: 'Nomenclador Odontológico Nacional as a source catalog and secondary identifier for DENTAR-PR.'
        code_cao: 'National Ophthalmology Nomenclator from the Argentine Council of Ophthalmology as a source catalog; keeps its original numbering.'
        code_regional: 'Regional Reference Ophthalmic Nomenclator (northwest Argentina) as a source catalog; keeps its original numbering.'
        code_nbu: 'Nomenclador Bioquímico Único with Unidades Bioquímicas.'
        code_nn_pmo: 'Nomenclador Nacional de prácticas médicas y quirúrgicas.'
        editorial_title: 'Language editorial control'
        editorial_text: 'Fields with a currently approved review are served in the effective language. If there is no review, the value is null and untranslated=true. A dialect is never inferred from a generic translation.'
        pricing_title: 'Current pricing'
        pricing_text: 'pricing exposes unit_type, unit_name, units, fixed_price, and expenses from os_fee_item for the current date. It does not include UVR values or conversions to pesos.'
    mappings:
        title: '7. Mappings and pharmacy'
        lead: 'Relationships between catalogs and pharmaceutical product identifiers.'
        search_title: 'GET /v1/mappings'
        search_text: 'Accepts system, code, and catalog. Returns catalog, catalog_code, term, target_system, target_uri, target_code, target_display, equivalence, role, rationale, and field_languages. It is limited to 50 results without pagination.'
        units_title: 'GET /v1/pricing-units'
        units_text: 'Lists code, name, organization, and description of the configured pricing units, for example UB.'
        pharma_title: 'GET /v1/medicines/identifiers/{system}/{code}'
        pharma_text: 'Looks up a drug by TROQUEL, ALFABETA, KAIROS, or GTIN. system is normalized to uppercase. Returns brand, laboratory, ingredient, presentation, pharmaceutical form, sales type, pharmacological action, and identifiers.'
        param_system: 'Identifier system: troquel, alfabeta, kairos, or gtin.'
        param_code: 'Code within the specified system.'
        param_catalog: 'Catalog code; filters the returned mappings.'
        example_title: 'Example with cURL'
    clinical:
        title: '8. Clinical terminologies'
        lead: 'Dedicated endpoints for the most widely used terminology sources.'
        snomed_title: 'SNOMED CT'
        snomed_text: 'GET /v1/snomed/{sctid} and GET /v1/concepts/{id} return concept_id, descriptions grouped by language, parents, children, CIE-10 codes, and a dental block when linked data exists.'
        cie10_title: CIE-10
        cie10_text: 'GET /v1/cie10/{codigo} validates the code format and returns type, descriptions by language, and up to 50 related snomed_concepts.'
        loinc_title: LOINC
        loinc_text: 'GET /v1/loinc accepts q, class, status, system, limit, and offset. GET /v1/loinc/{code} adds definition, formula, MapTo, and associated Argentine nomenclators.'
        anmat_title: ANMAT
        anmat_text: 'GET /v1/anmat/{id} returns certificate, commercial_name, generic_name, pharmaceutical_form, presentation, laboratory, and snomed_concept when the link exists.'
        nomenclador_title: 'Argentine nomenclators'
        nomenclador_text: 'GET /v1/nomenclador queries nomencladores_argentina with q, type or tipo, and limit. type accepts NN_PMO, NBU, NHPGD, ANDIS, KINESIOLOGIA, and SALUD_MENTAL.'
        vademecum_title: Vademecum
        vademecum_text: 'GET /v1/vademecum accepts q, troquel, alfabeta, kairos, gtin, and limit. It returns commercial data and the linked SNOMED concept_id.'
        pmo_title: PMO
        pmo_text: 'GET /v1/pmo/practicas, /v1/pmo/practicas/{code}, /v1/pmo/medicamentos, and /v1/pmo/normativa expose practices, drugs, and regulatory text with their own filters.'
        local_title: 'Local catalogs'
        local_text: 'GET /v1/{laboratorio|vacunas|odontologia|prestaciones|programas|imagenes}/{id} returns the generic detail of these local catalogs. UI relationships such as focus, tab, or compare are not part of this REST contract.'
    dental:
        title: '9. Dentistry and DENTAR'
        lead: 'DENTAR publishes its own procedures and diagnoses without duplicating assumed clinical equivalences between sources.'
        codes_title: 'Visible codes'
        codes_text: 'Permanent codes use the format DNT-PR-NNNNNN for procedures and DNT-DX-NNNNNN for diagnoses. Official codes from each source are preserved as labeled secondary identifiers.'
        pr_title: 'DENTAR-PR procedures'
        pr_text: 'GET /v1/catalogs/dentar-pr/items and /items/{code} expose dental services with their permanent code, official code, category, pricing, and mappings.'
        dx_title: 'DENTAR-DX diagnoses'
        dx_text: 'GET /v1/odontologia/diagnosticos searches by q, snomed, or cie10. GET /v1/odontologia/diagnosticos/{identifier} accepts a DENTAR code, SCTID, CIE-10, or numeric ID.'
        just_title: 'Service justification'
        just_text: 'GET /v1/odontologia/{identifier}/diagnosticos returns the service and the diagnoses that justify it, with relationship_type and clinical_rationale as stated in the source.'
        snomed_title: 'Resolution by SNOMED-CT'
        snomed_text: 'GET /v1/odontologia/snomed/{sctid} reports has_procedures, has_diagnoses, and the procedures and diagnoses collections linked to the concept.'
        nomenclador_title: 'Nomenclador Odontológico Nacional'
        nomenclador_text: 'It is integrated as a queryable source catalog (nomenclador-odontologico-ar) and as a searchable secondary identifier in DENTAR-PR. No translations or inferred clinical equivalences are published.'
        cdt_title: 'CDT and NN 2025'
        cdt_text: 'CDT remains in its native tables and is exposed through dentistry search and detail. CDT text in es is never presented as es-AR without regional evidence.'
        cdt_no_endpoint: 'There is no /v1/cdt.'
        nn_title: 'NN 2025'
        nn_text: 'It remains in nomenclador_2025. It has no dedicated endpoint or mapping to the os_* tables; its future exposure is pending.'
        relations_title: 'Literal relationships'
        relations_text: 'Relationships between procedures, diagnoses, and external codes are shown exactly as recorded in the source. Two codes must not be interpreted as clinically equivalent unless the source explicitly states so.'
        example_title: 'Example with cURL'
    pending:
        title: '10. Pending features'
        lead: 'Everything listed in this article is outside the current contract. It should not be documented or consumed as available.'
        fhir_title: 'HL7 FHIR R4'
        fhir_text: 'There is no /fhir route in api/index.php. README-FHIR.md describes a proposed contract. The current authentication guard covers only /v1/, so any future implementation must review that scope before release.'
        uvr_title: UVR
        uvr_text: "The public API does not expose UVR values. The repository documents the methodology and includes a verifiable example of 33.00 UVR for an OFTAR-PR service; no fee schedules or published geographic indices are presented."
        oauth_title: 'OAuth, scopes, and rate limiting'
        oauth_text: 'There is no OAuth 2.0, JWT, scopes, quotas, or 429. The rate_limit_per_second field is read but not enforced. There is no 403 for suspension or quota either.'
        writes_title: 'Write operations'
        writes_text: 'There is no POST, PUT, PATCH, or DELETE. The API is read-only and does not manage catalogs, credentials, or translations.'
        console_title: 'Developer console'
        console_text: 'The credentials console exists in `/portal-clientes` and is disabled by default; V8.001 was applied only in the test environment. Pepper hashing is prepared in code, but migration V11.001 requires approval and has not been executed. There is no OAuth/JWT or scopes.'
        catalogs_title: 'Reserved catalogs'
        catalogs_text: 'dentar-an, dentar-cl, dentar-in, dentar-pd, and dentar-eq are reserved without public data. os_catalog_relation relationships are not exposed via the API either, nor is PHI content such as PACS images.'
        alignment_title: 'Specification alignment'
        alignment_text: 'History: the known OpenAPI deviations were fixed in Phase 2. The current spec is the source of truth for the contract; the table below is the checklist.'
    openapi:
        title: '11. OpenAPI and client generation'
        lead: 'The existing specification is the reference for client generation, but it must be cross-checked against the code until alignment is complete.'
        spec_title: 'Current specification'
        spec_text: 'docs/api/openapi-3.1.yaml declares openapi 3.1.0, 30 paths, 30 GET operations, and valid references. It does not include /fhir/* because it is not implemented.'
        spec_link: 'Specification file'
        divergences_title: 'Reconciliation applied'
        divergences_text: 'These deviations were fixed in Phase 2. Use this table as a checklist when generating clients or contract tests.'
        div_q: 'q: the spec declares 2–80 characters, matching the code in /v1/search.'
        div_lang: 'lang: the spec declares es by default, matching API_DEFAULT_LANG.'
        div_limit: 'limit: the spec declares a maximum of 100 and notes that 50 is effective by default.'
        div_request_id: 'request_id: the spec no longer declares UUID; it documents 32 hex characters or an 8–64 X-Request-Id.'
        div_health: '/health: the spec no longer declares request_id in the body; the response is flat.'
        div_domains: 'Domain: the spec uses id and label/description by language, matching the actual response.'
        div_params: 'The spec documents implemented parameters: cie10_type, refset, class, status, system, offset, alfabeta, kairos, and gtin, among others.'
        div_methods: 'The spec documents OPTIONS/204 without Allow and 405 with Allow: GET, OPTIONS.'
        generate_title: 'Integration recommendation'
        generate_text: 'Generate the client from the spec, add contract tests for the listed deviations, and keep the API Key out of generated code and any public artifact.'
    support:
        title: '12. Security and support'
        lead: 'Operational best practices and contact channels.'
        security_title: Security
        security_text: 'Use HTTPS, store the credential in a secret manager, rotate it manually when appropriate, and do not log it. The API does not expose internal messages in 500 errors.'
        logging_title: Traceability
        logging_text: 'Server logs record request_id, method, route, and exception class, but not search terms or clinical data. Save the request_id from the header to correlate incidents.'
        contact_title: Contact
        contact_text: 'To request an API Key, report a contract deviation, or inquire about data availability, write to contacto@origen.ar.'
        legal_title: 'Legal notices'
        legal_text: 'SNOMED CT® is a registered trademark of SNOMED International. Origen Salud is not affiliated with or endorsed by SNOMED International. Official sources are used as a reference and retain their terms of use.'
        no_credentials: ' This site will never ask you for a real API Key.'
    footer:
        rights: '© 2026 Origen Salud. All rights reserved.'
        disclaimer: 'Documentation based on the actual contract of the public v1 API.'
