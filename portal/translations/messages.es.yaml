    header_title: "Documentación de la API para Desarrolladores"
    header_lead: "Conecta tus Historias Clínicas Electrónicas (HCE), motores de auditoría odontológica y plataformas de receta electrónica a la infraestructura de terminología clínica unificada de Origen Salud."
    overview_title: "1. Información General y URLs Base"
    overview_text: "Todas las solicitudes se realizan mediante HTTPS y devuelven respuestas en formato JSON codificado en UTF-8."
    table_environment: "Entorno"
    table_description: "Descripción"
    env_rest: "API REST unificada de consultas y auditoría terminológica."
    env_fhir: "Servidor terminológico estándar HL7 FHIR Release 4."
    env_health: "Endpoint público para balanceadores y monitoreo de disponibilidad."
    auth_title: "2. Autenticación"
    auth_text: "La autenticación se realiza mediante una API Key corporativa enviada en las cabeceras HTTP. Es posible enviarla mediante Bearer token estándar o mediante la cabecera X-API-Key:"
    auth_important: "Importante:"
    auth_warning: "Nunca expongas tu API Key en aplicaciones del lado del cliente (SPAs, páginas web públicas o apps móviles sin backend intermedio). Todas las llamadas deben originarse desde servidores seguros."
    catalogs_title: "3. Motor de Catálogos y Nomencladores Argentinos"
    catalogs_text: "Origen Catalog Engine 1.0 ofrece acceso desacoplado y versionado a los nomencladores nacionales argentinos, catálogos propios (DENTAR), esquemas arancelarios (UB, Galenos, Módulos, Pesos) e identificadores farmacéuticos (Troquel, AlfaBeta, Kairos, GTIN)."
    table_scope: "Ámbito"
    table_catalog_code: "Código de Catálogo"
    catalog_dentar: "Sistema DENTAR: Prestaciones odontológicas armonizadas con ADA CDT 2025 y CIE-10."
    catalog_pmo: "Nomenclador Nacional Médico y Quirúrgico (PMO) con Galenos."
    catalog_nbu: "Nomenclador Bioquímico Único de CUBRA con Unidades Bioquímicas (UB) y LOINC."
    catalog_hospitales: "Nomenclador de Hospitales Públicos Descentralizados (recupero hospitalario)."
    catalog_discapacidad: "Nomenclador de Prestaciones Básicas para Personas con Discapacidad (ANDIS)."
    catalog_fisioterapia: "Nomenclador de Fisioterapia y Kinesiología motriz y respiratoria."
    catalog_psicologia: "Nomenclador de Psicología y Salud Mental (psicoterapias y peritajes)."
    catalog_items_title: "Consultar Prestaciones de un Catálogo"
    copy: "Copiar"
    mappings_title: "Mapeos Cruzados (SNOMED-CT, CIE-10, LOINC)"
    mappings_text: "Descubre qué prestaciones corresponden a un concepto clínico internacional (o viceversa)."
    pharma_title: "Farmacia: Identificadores Comerciales (Troquel / AlfaBeta / Kairos / GTIN)"
    pharma_text: "Valida recetas electrónicas y coberturas de farmacia directamente por Número de Troquel, código AlfaBeta, código Kairos o código de barras GTIN."
    search_title: "3. Búsqueda Unificada Multimodelo"
    search_text: "Realiza búsquedas simultáneas ultrarrápidas a través de múltiples vocabularios clínicos. La coincidencia por trigramas (pg_trgm) y ponderación fonética ofrece tolerancia ante errores ortográficos."
    table_parameter: "Parámetro"
    table_type: "Tipo"
    table_default: "Defecto"
    table_required: "Requerido"
    search_q: "Término a buscar, palabra clave clínica o código exacto."
    search_domains: "Lista separada por comas de dominios clínicos a consultar."
    search_limit: "Cantidad de resultados por página (máximo 100)."
    search_lang: "Idioma de las descripciones (es-AR, en, pt-BR; es y pt son alias)."
    search_accept_language: "Cabecera Accept-Language; se usa cuando no se envía lang."
    dental_title: "4. Módulo Odontológico (DENTAR / ADA CDT / CIE-10)"
    dental_text: "DENTAR armoniza los 11 capítulos del Nomenclador Odontológico Argentino, ADA CDT 2025 (12 categorías), códigos permanentes DNT-XXXXXX, procedimientos clínicos SNOMED-CT y justificaciones diagnósticas CIE-10 (K00–K14)."
    dental_diagnoses_title: "Catálogo y Búsqueda de Diagnósticos Odontológicos"
    dental_justification_title: "Justificación Clínica y Auditoría para Prestaciones"
    dental_justification_text: "Consulta qué diagnósticos justifican una práctica odontológica antes de autorizarla o facturarla. Acepta indistintamente código del nomenclador argentino (02.01), código CDT (D2140), código DENTAR (DNT-PR-000007), ID numérico o SCTID de SNOMED-CT (424759004)."
    dental_snomed_title: "Resolución Directa por SNOMED-CT"
    dental_snomed_text: "Consulta cualquier Concept ID de SNOMED-CT para descubrir de inmediato si representa una práctica odontológica, un diagnóstico bucal o ambos, con todos sus mapeos cruzados."
    clinical_title: "5. Catálogos Clínicos y Endpoints de Conceptos"
    snomed_text: "Devuelve nombres completamente especificados (FSN), sinónimos activos, jerarquía directa (padres e hijos), mapeos a CIE-10 y un bloque dental enriquecido automáticamente si el concepto corresponde a odontología."
    cie10_text: "Consulta cualquier código CIE-10 de la OMS (ej. K02.1 o K021) con descripciones oficiales bilingües en español e inglés y equivalencias cruzadas a SNOMED-CT."
    anmat_text: "Consulta especialidades medicinales autorizadas por ANMAT Argentina, incluyendo número de certificado, nombre genérico y comercial, forma farmacéutica, laboratorio y concepto SNOMED-CT vinculado."
    loinc_text: "Búsqueda en los más de 112.400 conceptos oficiales de LOINC 2.83 con denominaciones localizadas en español (México y Argentina), propiedades analíticas, unidades UCUM, mapeos MapTo y correlación directa con el Nomenclador Bioquímico Único (NBU)."
    fhir_title: "6. Servicios de Terminología HL7® FHIR® R4"
    fhir_text: "Origen Salud soporta el estándar oficial HL7 FHIR Release 4 para servidores de terminología, permitiendo la integración directa con sistemas de Historia Clínica Electrónica como Epic, Cerner, GNU Health y OpenEMR."
    table_terminology: "Terminología"
    fhir_lookup_text: "Inspecciona un código y devuelve designaciones legibles, propiedades de auditoría (pieza requerida, radiografías previas/posteriores) y agrupaciones categóricas en un recurso FHIR Parameters estándar."
    fhir_expand_text: "Expande conjuntos de valores para búsqueda clínica en tiempo real, menús desplegables y autocompletado en la interfaz de la HCE."
    fhir_translate_text: "Traduce códigos entre diferentes vocabularios (ej. Nomenclador Argentino a ADA CDT 2025, o Prestación a Diagnósticos CIE-10 que la justifican)."
    fhir_resources_title: "Modelado de Recursos Clínicos"
    fhir_resources_text: "Ejemplo de representación de una intervención restauradora en un recurso HL7 FHIR Procedure con especificación de pieza dental 36 (sistema FDI) en bodySite:"
    copied: "¡Copiado!"

