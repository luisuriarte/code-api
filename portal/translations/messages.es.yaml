cdtnn:
    title: "Exposición real de CDT y nomencladores"
    intro: "Los nombres CDT y NN 2025 conservan sus tablas nativas. No se inventan traducciones, dialectos ni mapeos a las tablas os_*."
    cdt_title: "ADA CDT 2025 (tablas nativas)"
    cdt_text: "CDT se expone por búsqueda genérica de odontología y por detalle. Los campos nombre_es→es y nombre_en→en; dialect_determined=false para es."
    cdt_search: "Búsqueda CDT por /v1/search/odontologia"
    cdt_detail: "Detalle por /v1/odontologia/{id}"
    cdt_dialect: "Un texto CDT en es nunca se presenta como es-AR sin evidencia regional."
    no_cdt_endpoint: "No existe /v1/cdt."
    nn_title: "Nomenclador Nacional 2025 (NN 2025)"
    nn_text: "Permanece en nomenclador_2025. No tiene endpoint propio ni mapeo a os_*; su exposición futura sigue pendiente."
    nomenclador_title: "Nomencladores argentinos"
    nomenclador_text: "GET /v1/nomenclador consulta nomencladores_argentina, el único con entity_type='nomenclador'. No sirve CDT."
