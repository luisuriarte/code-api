dentar:
    meta_title: "DENTAR | Catálogo Argentino de Procedimientos Odontológicos"
    meta_description: "DENTAR es una iniciativa de Origen Salud para normalizar procedimientos y diagnósticos odontológicos, facilitar la interoperabilidad y conectar la odontología argentina con estándares internacionales."
    hero_eyebrow: "Catálogo odontológico · Origen Salud"
    hero_title: "DENTAR"
    hero_subtitle: "El Catálogo Argentino de Procedimientos Odontológicos"
    hero_lead: "Una iniciativa de Origen Salud para estructurar, normalizar y conectar los procedimientos y diagnósticos odontológicos mediante un catálogo clínico interoperable, en español y con proyección latinoamericana."
    hero_primary: "Consultar procedimientos"
    hero_secondary: "Consultar diagnósticos"
    hero_docs: "Conocer la documentación"
    hero_note: "DENTAR-PR · DENTAR-DX · Interoperabilidad sanitaria"
    hero_card_title: "Familia DENTAR"
    hero_card_label: "Catálogos activos"
    hero_card_pr: "DENTAR-PR · Procedimientos"
    hero_card_dx: "DENTAR-DX · Diagnósticos"
    hero_card_foot: "Catálogos independientes con prefijos y ciclos de versión propios"
    problem_eyebrow: "Presentación del proyecto"
    problem_title: "Un lenguaje común para la odontología"
    problem_lead: "DENTAR pretende ofrecer una referencia estructurada y mantenible, no solamente una lista de códigos."
    problem_1_title: "Diversidad de nomenclaturas"
    problem_1_text: "Conviven denominaciones y sistemas de codificación distintos para describir la misma prestación odontológica."
    problem_2_title: "Descripciones dispares"
    problem_2_text: "Una misma práctica puede figurar con textos diferentes según el sistema, el financiador o la institución."
    problem_3_title: "Intercambio de información"
    problem_3_text: "Sin identificadores comunes, compartir información odontológica entre sistemas resulta difícil y poco confiable."
    problem_4_title: "Normalización de prestaciones"
    problem_4_text: "La normalización de procedimientos y diagnósticos facilita la identificación, la auditoría y la comunicación clínica."
    problem_5_title: "Conexión con estándares"
    problem_5_text: "Los catálogos argentinos necesitan vínculos verificables con terminologías nacionales e internacionales."
    problem_6_title: "Integración de sistemas"
    problem_6_text: "La referencia debe ser utilizable por historias clínicas, sistemas odontológicos y plataformas de financiadores."
