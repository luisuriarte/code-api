    roadmap_title: "Un catálogo versionado y mantenible"
    roadmap_lead: "DENTAR se desarrolla con control de versiones, fuentes y revisión editorial."
    roadmap_1_title: "Versiones y fuentes"
    roadmap_1_text: "Cada publicación conserva su versión, su fuente y el ámbito de aplicación de los textos aprobados."
    roadmap_2_title: "Revisión editorial"
    roadmap_2_text: "Los cambios de definición o de mapeo se evalúan antes de publicarse; el contenido sin aprobación no se muestra como vigente."
    roadmap_3_title: "Proyección regional"
    roadmap_3_text: "La arquitectura está preparada para incorporar terminología odontológica de otros países de América Latina sin alterar los códigos argentinos."
    roadmap_4_title: "Dominios planificados"
    roadmap_4_text: "Anatomía dental (DENTAR-AN) y hallazgos clínicos (DENTAR-CL) figuran como dominios planificados. No tienen códigos ni catálogos publicados."
    roadmap_note: "No se anuncian fechas, hitos ni adhesiones institucionales sin evidencia."
