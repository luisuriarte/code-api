cdtnn:
    title: "Exposición real de CDT y nomencladores"
    intro: "Los nombres CDT y NN 2025 conservan sus tablas nativas. No se inventan traducciones, dialectos ni mapeos a las tablas os_*."
    cdt_title: "ADA CDT 2025 (tablas nativas)"
    cdt_text: "CDT se expone por búsqueda genérica de odontología y por detalle. Los campos nombre_es→es y nombre_en→en; dialect_determined=false para es."
    cdt_search: "Búsqueda CDT por /v1/search/odontologia"
    cdt_detail: "Detalle por /v1/odontologia/{id}"
    cdt_dialect: "Un texto CDT en es nunca se presenta como es-AR sin evidencia regional."
    no_cdt_endpoint: "No existe /v1/cdt."
    nn_title: "Nomenclador Nacional 2025 (NN 2025)"
    nn_text: "Permanece en nomenclador_2025. No tiene endpoint propio ni mapeo a os_*; su exposición futura sigue pendiente."
    nomenclador_title: "Nomencladores argentinos"
    nomenclador_text: "GET /v1/nomenclador consulta nomencladores_argentina, el único con entity_type='nomenclador'. No sirve CDT."

about:
    eyebrow: "Acerca de Origen Salud"
    title: "Terminología clínica como infraestructura"
    lead: "Construimos la capa terminológica que permite a sistemas sanitarios, empresas de software e instituciones hablar el mismo idioma clínico."
    mission_title: "Nuestra misión"
    mission_text: "Origen Salud reúne catálogos sanitarios oficiales y los expone de forma consistente, segura y multilingüe, para que cada organización pueda integrarlos sin reconstruirlos."
    scope_title: "Alcance"
    scope_text: "Trabajamos con SNOMED CT, CIE-10, LOINC, DENTAR, PMO, ANMAT y nomencladores argentinos, respetando las estructuras originales de cada fuente."
    interoperability_title: "Interoperabilidad"
    interoperability_text: "Nuestro motor común os_* convive con tablas especializadas. No forzamos modelos uniformes donde la fuente exige un tratamiento propio."
    catalogs_title: "Catálogos y terminologías"
    catalogs_text: "Cada catálogo mantiene su identidad, versión y reglas de publicación. El explorador del portal muestra solo los campos habilitados para publicación."
    region_title: "Proyección regional"
    region_text: "Nacemos en Argentina y diseñamos nuestra arquitectura para América Latina, con español argentino, inglés y portugués brasileño como idiomas del portal."
    principles_title: "Principios"
    principle_1_title: "Precisión terminológica"
    principle_1_text: "No generamos traducciones automáticas de términos clínicos. Publicamos solo contenido aprobado por el modelo editorial vigente."
    principle_2_title: "Trazabilidad"
    principle_2_text: "Cada texto publicado conserva su idioma efectivo, procedencia y estado editorial cuando corresponde mostrarlo."
    principle_3_title: "Integración simple"
    principle_3_text: "API pública para sistemas externos y portal propio para explorar y contratar, con responsabilidades separadas."
    cta_title: "¿Querés conocer el catálogo disponible?"
    cta_text: "Explorá los códigos o escribinos para evaluar una integración."

