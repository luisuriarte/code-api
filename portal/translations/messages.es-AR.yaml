    value_rvu_title: "Unidades de valor relativo"
    value_rvu_text: "Las unidades relativas propias del catálogo son una magnitud de referencia técnica, no un importe monetario."
    value_fee_title: "Aranceles externos"
    value_fee_text: "Los valores monetarios pertenecen a sistemas externos identificados por sistema, versión y período de vigencia."
    value_history_title: "Valores históricos y vigentes"
