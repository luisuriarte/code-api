    cdt_detail: "Detail via /v1/odontologia/{id}"
    cdt_dialect: "CDT text in es is never presented as es-AR without regional evidence."
    no_cdt_endpoint: "There is no /v1/cdt endpoint."
    nn_title: "National Nomenclator 2025 (NN 2025)"
    nn_text: "It remains in nomenclador_2025. It has no dedicated endpoint and no mapping to os_*; its future exposure is still pending."
    nomenclador_title: "Argentine nomenclators"
    nomenclador_text: "GET /v1/nomenclador queries nomencladores_argentina, the only entity_type='nomenclador'. It does not serve CDT."
