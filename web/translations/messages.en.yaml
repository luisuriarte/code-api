    header_title: "Developer API Documentation"
    header_lead: "Connect your Electronic Health Records (EHR), dental billing engines, and e-prescription systems with Origen Salud B2B Terminology-as-a-Service and HL7 FHIR R4 standard services."
    overview_title: "1. Overview & Base URLs"
    overview_text: "All API endpoints deliver JSON responses with UTF-8 encoding. Requests must be performed over HTTPS."
    table_environment: "Environment"
    table_description: "Description"
    env_rest: "Unified REST API for terminology queries and audits."
    env_fhir: "Official HL7 FHIR Release 4 Terminology Server."
    env_health: "Public monitoring endpoint for uptime and load balancers."
    auth_title: "2. Authentication"
    auth_text: "Authentication is performed using a B2B API Key sent in the HTTP headers. You can pass it via standard Bearer token or direct X-API-Key header:"
    auth_important: "Important:"
    auth_warning: "Never expose your API Key in client-side applications (SPA, public web pages, or mobile apps). All requests should originate from your secure backend servers."
    catalogs_title: "3. Origen Catalog Engine & Argentine Healthcare Catalogs"
    catalogs_text: "Origen Catalog Engine 1.0 provides decoupled, versioned access to national healthcare nomenclators, proprietary catalogs (DENTAR), pricing schedules (UB, Galenos, Modules, Pesos), and pharmaceutical identifiers (Troquel, AlfaBeta, Kairos, GTIN)."
    table_scope: "Scope"
    table_catalog_code: "Catalog Code"
    catalog_dentar: "DENTAR-PR: procedimientos odontológicos harmonized with ADA CDT 2025 and ICD-10."
    catalog_pmo: "National Medical & Sanatorial Nomenclator (PMO) with Galenos."
    catalog_nbu: "CUBRA Single Biochemical Nomenclator with Biochemical Units (UB) & LOINC."
    catalog_hospitales: "Decentralized Public Hospitals Nomenclator for cost recovery."
    catalog_discapacidad: "Disability Basic Services Nomenclator with rehabilitation modules."
    catalog_fisioterapia: "Kinesiology and Physical Therapy sessions."
    catalog_psicologia: "Psychology and Mental Health sessions and psychodiagnosis."
    catalog_items_title: "Browse Catalog Items & Procedures"
    copy: "Copy"
    mappings_title: "Cross-Terminology Mappings (SNOMED, CIE-10, LOINC)"
    mappings_text: "Discover which procedures correspond to an international clinical concept (or vice-versa)."
    pharma_title: "Pharmacy: Commercial Identifiers (Troquel / AlfaBeta / Kairos / GTIN)"
    pharma_text: "Validate prescriptions and insurance coverage directly by Troquel number, AlfaBeta ID, Kairos ID, or GS1 GTIN barcode."
    search_title: "3. Unified Multimodel Search"
    search_text: "Perform blazing-fast searches across multiple clinical vocabularies simultaneously. Trigram matching (pg_trgm) and phonetic ranking ensure typo tolerance."
    table_parameter: "Parameter"
    table_type: "Type"
    table_default: "Default"
    table_required: "Required"
    search_q: "Search term, clinical keyword or exact code."
    search_domains: "Comma-separated list of domains to search."
    search_limit: "Number of results (max 100)."
    search_lang: "Language for descriptions (es-AR, en, pt-BR; es and pt are aliases)."
    search_accept_language: "Accept-Language header; used when lang is absent."
    dental_title: "4. Dental Module (DENTAR / ADA CDT / CIE-10)"
    dental_text: "DENTAR-PR armoniza los procedimientos dentales y DENTAR-DX los diagnósticos of the Argentine Dental Nomenclator, ADA CDT 2025 (12 categories), permanent DNT-XXXXXX codes, SNOMED-CT clinical procedures, and ICD-10 (K00–K14) diagnosis justifications."
    dental_diagnoses_title: "Dental Diagnoses Catalog & Search"
    dental_justification_title: "Clinical Justification & Audit Rules for Procedures"
    dental_justification_text: "Verify which diagnoses justify a dental procedure before authorization or billing. Accepts Argentine code (02.01), CDT (D2140), DENTAR (DNT-PR-000007), internal ID, or SNOMED-CT SCTID (424759004)."
    dental_snomed_title: "Direct SNOMED-CT Dental Resolution"
    dental_snomed_text: "Query any SNOMED-CT Concept ID to instantly discover if it represents a dental procedure, a diagnosis, or both, with all cross-mappings."
    clinical_title: "5. Clinical Catalogs & Concept Endpoints"
    snomed_text: "Returns fully specified names (FSN), active synonyms, direct hierarchy (parents and children), ICD-10 maps, and an enriched dental block if the concept relates to oral healthcare."
    cie10_text: "Lookup any WHO ICD-10 code (e.g., K02.1 or K021) with bilingual English and Spanish descriptions and official SNOMED-CT cross-mappings."
    anmat_text: "Query medications authorized by ANMAT Argentina, including certificate number, generic/commercial brand, pharmaceutical form, presentation, lab, and mapped SNOMED-CT concept ID."
    loinc_text: "Search across all 112,400+ official LOINC 2.83 concepts with localized Spanish names (Mexico and Argentina), properties, UCUM units, MapTo links, and Argentine biochemical nomenclator (NBU) mappings."
    fhir_title: "6. HL7® FHIR® R4 Terminology Services"
    fhir_text: "Origen Salud supports the official HL7 FHIR Release 4 standard for Terminology Servers, allowing seamless integration with EHR systems such as Epic, Cerner, GNU Health, and OpenEMR."
    table_terminology: "Terminology"
    fhir_lookup_text: "Inspects a code and returns human-readable designations, audit properties (e.g. tooth required, pre/post-op x-rays), and category groupings in a standard FHIR Parameters resource."
    fhir_expand_text: "Expands a ValueSet for live clinical search, dropdowns, and autocomplete in the EHR UI."
    fhir_translate_text: "Translates codes across systems (e.g. Argentine Nomenclator to ADA CDT 2025, or Procedure to justifying ICD-10 Diagnoses)."
    fhir_resources_title: "Clinical Resource Modeling"
    fhir_resources_text: "Example representing a restorative dental intervention in an HL7 FHIR Procedure resource with tooth 36 (FDI system) in bodySite:"
    copied: "Copied!"

