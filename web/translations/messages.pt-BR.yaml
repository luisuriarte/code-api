    header_title: "Documentação da API para desenvolvedores"
    header_lead: "Conecte seus prontuários eletrônicos, motores de auditoria odontológica e sistemas de prescrição eletrônica à infraestrutura de terminologia clínica unificada da Origen Salud."
    overview_title: "1. Visão geral e URLs base"
    overview_text: "Todas as requisições são feitas por HTTPS e retornam respostas JSON codificadas em UTF-8."
    table_environment: "Ambiente"
    table_description: "Descrição"
    env_rest: "API REST unificada para consultas e auditorias terminológicas."
    env_fhir: "Servidor terminológico padrão HL7 FHIR Release 4."
    env_health: "Endpoint público para balanceadores e monitoramento de disponibilidade."
    auth_title: "2. Autenticação"
    auth_text: "A autenticação é feita com uma API Key corporativa enviada nos cabeçalhos HTTP. Ela pode ser enviada como Bearer token padrão ou diretamente no cabeçalho X-API-Key:"
    auth_important: "Importante:"
    auth_warning: "Nunca exponha sua API Key em aplicações client-side (SPAs, páginas públicas ou aplicativos móveis sem backend). Todas as chamadas devem partir de servidores seguros."
    catalogs_title: "3. Motor de catálogos e nomencladores argentinos"
    catalogs_text: "O Origen Catalog Engine 1.0 oferece acesso desacoplado e versionado aos nomencladores nacionais argentinos, catálogos próprios (DENTAR), esquemas tarifários (UB, Galenos, Módulos, Pesos) e identificadores farmacêuticos (Troquel, AlfaBeta, Kairos, GTIN)."
    table_scope: "Âmbito"
    table_catalog_code: "Código do catálogo"
    catalog_dentar: "Sistema DENTAR: prestações odontológicas harmonizadas com ADA CDT 2025 e CIE-10."
    catalog_pmo: "Nomenclador Nacional Médico e Cirúrgico (PMO) com Galenos."
    catalog_nbu: "Nomenclador Bioquímico Único da CUBRA com Unidades Bioquímicas (UB) e LOINC."
    catalog_hospitales: "Nomenclador de Hospitais Públicos Descentralizados (recuperação hospitalar)."
    catalog_discapacidad: "Nomenclador de Prestações Básicas para Pessoas com Deficiência (ANDIS)."
    catalog_fisioterapia: "Nomenclador de Fisioterapia e Quinesiologia motora e respiratória."
    catalog_psicologia: "Nomenclador de Psicologia e Saúde Mental (psicoterapias e perícias)."
    catalog_items_title: "Consultar prestações de um catálogo"
    copy: "Copiar"
    mappings_title: "Mapeamentos cruzados (SNOMED-CT, CIE-10, LOINC)"
    mappings_text: "Descubra quais prestações correspondem a um conceito clínico internacional (ou vice-versa)."
    pharma_title: "Farmácia: identificadores comerciais (Troquel / AlfaBeta / Kairos / GTIN)"
    pharma_text: "Valide receitas eletrônicas e coberturas de farmácia pelo número de Troquel, código AlfaBeta, código Kairos ou código de barras GTIN."
    search_title: "3. Busca unificada multimodelo"
    search_text: "Realize buscas simultâneas ultrarrápidas em vários vocabulários clínicos. A correspondência por trigramas (pg_trgm) e a ponderação fonética toleram erros de digitação."
    table_parameter: "Parâmetro"
    table_type: "Tipo"
    table_default: "Padrão"
    table_required: "Obrigatório"
    search_q: "Termo de busca, palavra-chave clínica ou código exato."
    search_domains: "Lista de domínios clínicos separada por vírgulas."
    search_limit: "Número de resultados por página (máximo 100)."
    search_lang: "Idioma das descrições (es-AR, en, pt-BR; es e pt são alias)."
    search_accept_language: "Cabeçalho Accept-Language; usado quando lang não é enviado."
    dental_title: "4. Módulo odontológico (DENTAR / ADA CDT / CIE-10)"
    dental_text: "O DENTAR-PR harmoniza procedimentos odontológicos e o DENTAR-DX, diagnósticos do Nomenclador Odontológico Argentino, ADA CDT 2025 (12 categorias), códigos permanentes DNT-XXXXXX, procedimentos clínicos SNOMED-CT e justificativas CIE-10 (K00–K14)."
    dental_diagnoses_title: "Catálogo e busca de diagnósticos odontológicos"
    dental_justification_title: "Justificativa clínica e auditoria de prestações"
    dental_justification_text: "Consulte quais diagnósticos justificam um procedimento odontológico antes da autorização ou faturamento. Aceita código argentino (02.01), CDT (D2140), DENTAR (DNT-PR-000007), ID interno ou SCTID do SNOMED-CT (424759004)."
    dental_snomed_title: "Resolução odontológica direta por SNOMED-CT"
    dental_snomed_text: "Consulte qualquer Concept ID do SNOMED-CT para descobrir imediatamente se ele representa um procedimento odontológico, um diagnóstico ou ambos, com todos os mapeamentos cruzados."
    clinical_title: "5. Catálogos clínicos e endpoints de conceitos"
    snomed_text: "Retorna nomes totalmente especificados (FSN), sinônimos ativos, hierarquia direta (pais e filhos), mapeamentos para CIE-10 e um bloco odontológico enriquecido quando o conceito pertence à saúde bucal."
    cie10_text: "Consulte qualquer código CIE-10 da OMS (por exemplo, K02.1 ou K021) com descrições oficiais bilíngues em espanhol e inglês e equivalências cruzadas com SNOMED-CT."
    anmat_text: "Consulte especialidades medicinais autorizadas pela ANMAT Argentina, incluindo número de certificado, nome genérico e comercial, forma farmacêutica, apresentação, laboratório e conceito SNOMED-CT associado."
    loinc_text: "Busque mais de 112.400 conceitos oficiais do LOINC 2.83 com nomes localizados em espanhol (México e Argentina), propriedades, unidades UCUM, vínculos MapTo e mapeamentos para o Nomenclador Bioquímico Único (NBU)."
    fhir_title: "6. Serviços terminológicos HL7® FHIR® R4"
    fhir_text: "A Origen Salud suporta o padrão oficial HL7 FHIR Release 4 para servidores terminológicos, permitindo integração direta com prontuários eletrônicos como Epic, Cerner, GNU Health e OpenEMR."
    table_terminology: "Terminologia"
    fhir_lookup_text: "Inspeciona um código e retorna designações legíveis, propriedades de auditoria (por exemplo, dente obrigatório, radiografias pré/pós-operatórias) e agrupamentos categóricos em um recurso FHIR Parameters padrão."
    fhir_expand_text: "Expande um ValueSet para busca clínica em tempo real, listas suspensas e autocomplete na interface do prontuário."
    fhir_translate_text: "Traduz códigos entre sistemas (por exemplo, Nomenclador Argentino para ADA CDT 2025, ou Procedimento para diagnósticos CIE-10 que o justificam)."
    fhir_resources_title: "Modelagem de recursos clínicos"
    fhir_resources_text: "Exemplo de representação de uma intervenção odontológica restauradora em um recurso HL7 FHIR Procedure com o dente 36 (sistema FDI) em bodySite:"
    copied: "Copiado!"

