cdtnn:
    title: "Exposição real de CDT e nomencladores"
    intro: "CDT e NN 2025 mantêm suas tabelas nativas. Não são inventadas traduções, dialetos nem mapeamentos para tabelas os_*."
    cdt_title: "ADA CDT 2025 (tabelas nativas)"
    cdt_text: "CDT é exposto pela busca odontológica genérica e pelo endpoint de detalhe. nombre_es mapeia para es e nombre_en para en; dialect_determined=false para es."
    cdt_search: "Busca CDT via /v1/search/odontologia"
    cdt_detail: "Detalhe via /v1/odontologia/{id}"
    cdt_dialect: "Um texto CDT em es nunca é apresentado como es-AR sem evidência regional."
    no_cdt_endpoint: "Não existe o endpoint /v1/cdt."
    nn_title: "Nomenclador Nacional 2025 (NN 2025)"
    nn_text: "Permanece em nomenclador_2025. Não tem endpoint próprio nem mapeamento para os_*; sua exposição futura continua pendente."
    nomenclador_title: "Nomencladores argentinos"
    nomenclador_text: "GET /v1/nomenclador consulta nomencladores_argentina, o único com entity_type='nomenclador'. Não serve CDT."
