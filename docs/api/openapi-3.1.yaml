openapi: 3.1.0
info:
  title: Origen Salud API
  version: 1.0.0
  summary: Búsqueda unificada de terminología clínica y catálogos sanitarios.
  description: |
    Contrato de la API REST real montada en `api/index.php`.

    - Prefijo: `/v1`. Todas las rutas `/v1/*` requieren API Key.
    - `/health` es pública.
    - Envelope de éxito: `data`, `meta` y `request_id`.
    - Envelope de error: `error.code`, `error.message`, `error.details` opcional y `request_id`.
    - Los errores 500 no incluyen mensajes internos.
    - `request_id` es hexadecimal de 32 caracteres generado por el servidor, o el
      valor recibido en `X-Request-Id` (8–64 caracteres `[A-Za-z0-9._-]`); no es UUID.
    - El enrutador responde `OPTIONS` con `204` en rutas conocidas (sin cabecera
      `Allow`) y `405` con `Allow: GET, OPTIONS` para métodos no soportados.
      Estas respuestas son transversales y no se repiten en cada operación.
    - Los catálogos sin ítems devuelven `200` con `data: []` (no `404`).
    - `400` puede emitirse en cualquier operación con parámetros inválidos;
      donde no se documenta explícitamente, aplica `ErrorEnvelope`.
    - `/fhir/*` **no está implementado**; ver `README-FHIR.md`.
  contact:
    name: Origen Salud
    url: https://origen.ar
  license:
    name: Uso interno / contrato documentado
servers:
  - url: https://api.origen.ar
    description: Producción
tags:
  - name: Descubrimiento
  - name: Búsqueda
  - name: Catálogos
  - name: Terminologías
  - name: Odontología
  - name: Nomencladores
security:
  - BearerAuth: []
  - ApiKeyHeader: []
paths:
  /health:
    get:
      tags: [Descubrimiento]
      operationId: health
      summary: Estado del servicio y de la base de datos.
      security: []
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/domains:
    get:
      tags: [Descubrimiento]
      operationId: listDomains
      summary: Dominios disponibles y dominios incluidos por defecto.
      responses:
        '200':
          description: Catálogo de dominios.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Domain'
                      meta:
                        $ref: '#/components/schemas/DomainMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/refsets:
    get:
      tags: [Descubrimiento]
      operationId: listRefsets
      summary: RefSets de SNOMED CT disponibles como filtro.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/search:
    get:
      tags: [Búsqueda]
      operationId: unifiedSearch
      summary: Búsqueda unificada en uno o varios dominios.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Domains'
        - $ref: '#/components/parameters/DomainQuery'
        - $ref: '#/components/parameters/AllFlag'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Refsets'
        - $ref: '#/components/parameters/Refset'
        - $ref: '#/components/parameters/Cie10Type'
      responses:
        '200':
          description: Resultados paginados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SearchResult'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/search/{domain}:
    get:
      tags: [Búsqueda]
      operationId: searchByDomain
      summary: Búsqueda restringida a un dominio.
      parameters:
        - $ref: '#/components/parameters/DomainPath'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Refset'
        - $ref: '#/components/parameters/Cie10Type'
        - $ref: '#/components/parameters/SnomedFilter'
        - $ref: '#/components/parameters/Cie10Filter'
        - $ref: '#/components/parameters/Tipo'
        - $ref: '#/components/parameters/Seccion'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/catalogs:
    get:
      tags: [Catálogos]
      operationId: listCatalogs
      summary: Catálogos publicados, incluida la familia DENTAR.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/catalogs/{catalog_code}/releases:
    get:
      tags: [Catálogos]
      operationId: listCatalogReleases
      summary: Versiones de un catálogo con vigencia y estado.
      description: "Un catálogo inexistente o sin versiones devuelve `200` con `data: []`; no se emite `404`."
      parameters:
        - $ref: '#/components/parameters/CatalogCode'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/catalogs/{catalog_code}/items:
    get:
      tags: [Catálogos]
      operationId: listCatalogItems
      summary: Ítems de un catálogo publicado.
      description: "Un catálogo inexistente o sin ítems devuelve `200` con `data: []`; no se emite `404`."
      parameters:
        - $ref: '#/components/parameters/CatalogCode'
        - $ref: '#/components/parameters/Q'
        - name: query
          in: query
          description: Alias de `q` en este endpoint.
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/catalogs/{catalog_code}/items/{item}:
    get:
      tags: [Catálogos]
      operationId: getCatalogItem
      summary: Detalle de un ítem por código permanente, oficial o término.
      description: "Un catálogo o ítem inexistente devuelve `200` con `data: []`; no se emite `404`."
      parameters:
        - $ref: '#/components/parameters/CatalogCode'
        - name: item
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,100}$' }
          example: DNT-PR-000001
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/mappings:
    get:
      tags: [Terminologías]
      operationId: listMappings
      summary: Mapeos cruzados entre sistemas terminológicos.
      parameters:
        - name: system
          in: query
          schema: { type: string }
          example: CDT-2025
        - name: code
          in: query
          schema: { type: string }
          example: D0150
        - name: catalog
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/pricing-units:
    get:
      tags: [Catálogos]
      operationId: listPricingUnits
      summary: Unidades arancelarias disponibles.
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/nomenclador:
    get:
      tags: [Nomencladores]
      operationId: searchNomenclador
      summary: Nomencladores argentinos unificados.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [NN_PMO, NBU, NHPGD, ANDIS, KINESIOLOGIA, SALUD_MENTAL]
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Tipo'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Capitulo'
        - $ref: '#/components/parameters/CoberturaCondicionada'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/vademecum:
    get:
      tags: [Nomencladores]
      operationId: searchVademecum
      summary: Vademécum comercial por troquel, código o monodroga.
      parameters:
        - name: troquel
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Alfabeta'
        - $ref: '#/components/parameters/Kairos'
        - $ref: '#/components/parameters/Gtin'
        - $ref: '#/components/parameters/Atc'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/medicines/identifiers/{system}/{code}:
    get:
      tags: [Nomencladores]
      operationId: getMedicineByIdentifier
      summary: Producto medicinal por identificador comercial.
      parameters:
        - name: system
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
          description: Cualquier sistema de identificador soportado por el repositorio (`troquel`, `alfabeta`, `kairos`, `gtin` y otros).
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/loinc:
    get:
      tags: [Terminologías]
      operationId: searchLoinc
      summary: Búsqueda en LOINC.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Class'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/System'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/loinc/{code}:
    get:
      tags: [Terminologías]
      operationId: getLoinc
      summary: Detalle de un código LOINC.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{1,7}-[0-9]$' }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/pmo/practicas:
    get:
      tags: [Nomencladores]
      operationId: listPmoPractices
      summary: Prácticas del Programa Médico Obligatorio.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Capitulo'
        - $ref: '#/components/parameters/CoberturaCondicionada'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/pmo/practicas/{code}:
    get:
      tags: [Nomencladores]
      operationId: getPmoPractice
      summary: Detalle de una práctica PMO.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^(?:[0-9]{2,6}|[0-9]{1,2}\.[0-9]{1,2})$' }
          description: Sin punto requiere al menos 2 dígitos; con punto admite 1 o 2 antes y 1 o 2 después.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/pmo/medicamentos:
    get:
      tags: [Nomencladores]
      operationId: listPmoMedicines
      summary: Medicamentos incluidos en PMO.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Atc'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/pmo/normativa:
    get:
      tags: [Nomencladores]
      operationId: listPmoRegulations
      summary: Normativa asociada al PMO.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Seccion'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/cie10/{codigo}:
    get:
      tags: [Terminologías]
      operationId: getCie10
      summary: Detalle de un código CIE-10.
      parameters:
        - $ref: '#/components/parameters/Language'
        - name: codigo
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z][0-9]{2}(?:\.[0-9A-Za-z]{1,4}|[0-9A-Za-z]{0,3})$' }
          description: El enrutador acepta mayúsculas y minúsculas en la inicial.
          example: K02.1
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/anmat/{id}:
    get:
      tags: [Terminologías]
      operationId: getAnmat
      summary: Detalle de un medicamento ANMAT por identificador numérico.
      parameters:
        - $ref: '#/components/parameters/Language'
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 999999999999 }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/snomed/{sctid}:
    get:
      tags: [Terminologías]
      operationId: getSnomed
      summary: Detalle de un concepto SNOMED CT por SCTID.
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Sctid'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/concepts/search:
    get:
      tags: [Terminologías]
      operationId: searchConceptsLegacy
      summary: Buscador SNOMED CT del contrato anterior.
      description: Delega en el buscador unificado; acepta también `refset(s)` y `cie10_type`.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Refsets'
        - $ref: '#/components/parameters/Refset'
        - $ref: '#/components/parameters/Cie10Type'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/concepts/{id}:
    get:
      tags: [Terminologías]
      operationId: getConceptLegacy
      summary: Alias de `/v1/snomed/{sctid}`.
      parameters:
        - $ref: '#/components/parameters/ConceptId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/odontologia/snomed/{sctid}:
    get:
      tags: [Odontología]
      operationId: getDentistryBySnomed
      summary: Procedimientos y diagnósticos odontológicos por SCTID.
      parameters:
        - $ref: '#/components/parameters/Sctid'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/odontologia/diagnosticos:
    get:
      tags: [Odontología]
      operationId: listDentalDiagnoses
      summary: Diagnósticos DENTAR-DX vinculados a CIE-10 y SNOMED CT.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Tipo'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /v1/odontologia/diagnosticos/{code}:
    get:
      tags: [Odontología]
      operationId: getDentalDiagnosis
      summary: Diagnóstico por código DENTAR-DX, CIE-10 o SCTID.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: DNT-DX-000006
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/odontologia/{code}/diagnosticos:
    get:
      tags: [Odontología]
      operationId: getClinicalJustifications
      summary: Diagnósticos que justifican una prestación odontológica.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: DNT-PR-000001
      responses:
        '200':
          description: Justificaciones clínicas de auditoría.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          procedure:
                            $ref: '#/components/schemas/DentalProcedure'
                          clinical_justifications:
                            type: array
                            items: { type: object }
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/{catalogo}/{id}:
    get:
      tags: [Terminologías]
      operationId: getDomainItem
      summary: Detalle genérico de un ítem de dominio de catálogo.
      parameters:
        - name: catalogo
          in: path
          required: true
          schema:
            type: string
            enum: [laboratorio, vacunas, odontologia, prestaciones, programas, imagenes]
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 999999999999 }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <API_KEY>"
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    Q:
      name: q
      in: query
      schema: { type: string, minLength: 2, maxLength: 80 }
      description: Texto libre; `/v1/search` valida entre 2 y 80 caracteres UTF-8.
    Domains:
      name: domains
      in: query
      schema:
        type: string
        default: snomed,cie10,anmat
      description: Dominios separados por coma, o `all`.
    DomainPath:
      name: domain
      in: path
      required: true
      schema:
        type: string
        enum: [snomed, cie10, anmat, laboratorio, vacunas, odontologia, prestaciones, programas, imagenes, nomenclador, vademecum, loinc]
    Language:
      name: lang
      in: query
      schema: { type: string, default: es }
      description: Idioma solicitado; el default real es `API_DEFAULT_LANG=es`. Admite `es`, `es-AR`, `en`, `pt-BR` según resolvedor.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Máximo efectivo por defecto 50; `API_PAGE_LIMIT_MAX` puede elevar el tope hasta 100.
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
    Refsets:
      name: refsets
      in: query
      schema: { type: string, maxLength: 200 }
    CatalogCode:
      name: catalog_code
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]+$' }
      example: dentar-pr
    Sctid:
      name: sctid
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]{6,18}$' }
      example: '22298006'
    ConceptId:
      name: id
      in: path
      required: true
      description: El enrutador expone el parámetro como `id`, no como `sctid`.
      schema: { type: string, pattern: '^[0-9]{6,18}$' }
      example: '22298006'
    DomainQuery:
      name: domain
      in: query
      description: Alias singular de `domains` en búsquedas unificadas.
      schema: { type: string }
    AllFlag:
      name: all
      in: query
      description: Alias `all`/`*` para seleccionar todos los dominios.
      schema: { type: string }
    Refset:
      name: refset
      in: query
      description: Alias singular de `refsets`.
      schema: { type: string }
    Cie10Type:
      name: cie10_type
      in: query
      schema: { type: string, enum: [diagnostico, procedimiento] }
      description: Tipo de código CIE-10; el código solo admite `diagnostico` o `procedimiento`.
    SnomedFilter:
      name: snomed
      in: query
      description: Alias `snomed`/`snomed_id` para filtrar por SCTID.
      schema: { type: string }
    Cie10Filter:
      name: cie10
      in: query
      description: Alias `cie10`/`cie10_code` para filtrar por código CIE-10.
      schema: { type: string }
    Tipo:
      name: tipo
      in: query
      description: Alias `type`/`tipo` para filtrar resultados por tipo.
      schema: { type: string }
    Alfabeta:
      name: alfabeta
      in: query
      schema: { type: string }
    Kairos:
      name: kairos
      in: query
      schema: { type: string }
    Gtin:
      name: gtin
      in: query
      schema: { type: string }
    Atc:
      name: atc
      in: query
      schema: { type: string }
    Class:
      name: class
      in: query
      schema: { type: string }
    Status:
      name: status
      in: query
      schema: { type: string }
    System:
      name: system
      in: query
      schema: { type: string }
    Capitulo:
      name: capitulo
      in: query
      description: Alias `capitulo`/`cap_cod`.
      schema: { type: string }
    CoberturaCondicionada:
      name: cobertura_condicionada
      in: query
      schema: { type: boolean }
    Seccion:
      name: seccion
      in: query
      schema: { type: string }

  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta, request_id]
      properties:
        data: {}
        meta: { type: object }
        request_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$'
          description: El servidor genera 32 hexadecimales; si el cliente envía X-Request-Id válido se devuelve tal cual (8–64 caracteres [A-Za-z0-9._-]). No es UUID.
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        request_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$'
          description: Siempre se emite; mismo formato que en SuccessEnvelope.
    HealthEnvelope:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: origen-salud-api }
        version: { type: string }
        time: { type: string, format: date-time }
        checks:
          type: object
          properties:
            database: { type: string, example: ok }
    Domain:
      type: object
      properties:
        id: { type: string, example: odontologia }
        label:
          type: object
          description: Texto por idioma (claves es-AR, en, pt-BR).
          additionalProperties: { type: string }
        description:
          type: object
          description: Texto por idioma (claves es-AR, en, pt-BR).
          additionalProperties: { type: string }
        source: { type: string }
        mode: { type: string, enum: [full, catalog] }
    DomainMeta:
      type: object
      properties:
        domains:
          type: array
          items: { type: string }
        default_domains:
          type: array
          items: { type: string }
          example: [snomed, cie10, anmat]
    PaginationMeta:
      type: object
      description: Campos reales devueltos por las rutas de búsqueda; no se emite `total`.
      properties:
        query: { type: string }
        language: { type: string }
        page_counts: { type: object, additionalProperties: { type: integer } }
        returned: { type: integer }
        has_more: { type: boolean }
        next_offset: { type: integer, nullable: true }
        took_ms: { type: number }
        limit: { type: integer }
        offset: { type: integer }
        domains:
          type: array
          items: { type: string }
    SearchResult:
      type: object
      properties:
        domain: { type: string }
        source: { type: string }
        id: { type: string }
        code: { type: string, nullable: true }
        term: { type: string }
        subtitle: { type: string, nullable: true }
        language: { type: string }
        kind: { type: string }
        score: { type: number }
        metadata: { type: object }
    DentalProcedure:
      type: object
      properties:
        dentar_code:
          type: string
          example: DNT-PR-000001
        name:
          type: string
          example: Evaluación oral integral - paciente nuevo o ya conocido
        nomenclador_argentino: { type: string, example: '01.01' }
        cdt_code: { type: string, example: D0150 }
        category: { type: string, example: CAT-DIAG }

  responses:
    Success:
      description: Respuesta correcta con envelope estándar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Falta o es inválida la API Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Error interno; el mensaje no expone detalles de la excepción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Base de datos no disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
